id: git-config-exposure
info:
  name: Exposed .git/config
  severity: medium
  description: Repository metadata reachable from the web root.
  tags: [exposure, git]
matchers-condition: and
matchers:
  - type: status
    status: [200]
  - type: word
    words: ["[core]", "repositoryformatversion"]
    condition: and
